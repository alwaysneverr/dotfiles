# mpv.conf — ASUS M415D (Ryzen 3 3250U, Vega 3 iGPU, 1080p, on battery a lot)
# Goal: smooth playback with low power use. Hardware decoding, cheap scaling.
 
# ---------- video ----------
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
hwdec=vaapi                        # Vega 3 decodes H.264/HEVC/VP9 in hardware (AV1: software)
profile=fast                       # cheap scalers; plenty for 1080p on a 1080p panel
deband=no
interpolation=no
video-sync=audio

# ---------- cache (helps with the CIFS media share) ----------
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=50MiB

# ---------- UI (uosc draws the controls) ----------
osc=no
osd-bar=no
border=no
keep-open=yes
save-position-on-quit=yes          # new: resume where you stopped
osd-status-msg=${playback-time/full} / ${duration} (${percent-pos}%)\nframe: ${estimated-frame-number} / ${estimated-frame-count}
screenshot-directory="~/Pictures/mpv-shot"

# ---------- audio / language ----------
alang=ja,jp,jpn,en,eng
slang=eng,en,enm
volume-max=300

# ---------- subtitles ----------
sub-auto=fuzzy                     # new: pick up external subs with similar names
sub-file-paths=subs:Subs:subtitles # new: also look in these subfolders
sub-codepage=utf-8
sub-ass-override=no                # toggled with k
sub-font="Gandhi Sans"
sub-font-size=50
sub-color="#FFFFFF"
sub-border-color="#FF000000"
sub-shadow-color="#A0000000"
sub-border-size=2.4
sub-shadow-offset=0.75
sub-bold=yes
sub-margin-x=40
sub-margin-y=40
