general {
    # Avoid locking or dimming active media play streams via playerctl/mpv
    ignore_dbus_inhibit = false
    lock_cmd = uwsm app -- hyprlock
}

# 1. Dim Screen Light (After 2.5 minutes of inactivity)
listener {
    timeout = 150
    on-timeout = brightnessctl -e4 -s set 10%
    on-resume = brightnessctl -e4 -r
}

# 2. Shift to Power Saver Profile (After 3 minutes of inactivity)
listener {
    timeout = 180
    on-timeout = powerprofilesctl set power-saver
    on-resume = powerprofilesctl set balanced
}

# 3. Fire Lock Screen Canvas (After 5 minutes of inactivity)
listener {
    timeout = 300
    on-timeout = uwsm app -- hyprlock
}

# 4. Deep Sleep Suspend Matrix (After 10 minutes of inactivity on battery)
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
