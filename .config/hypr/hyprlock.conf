source = /home/alwaysnever/.config/themes/current/gen/hyprlock.conf
# ~/.config/hypr/hyprlock.conf  (Hsin palette)

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    # Prefer your wallpaper instead? Use: path = ~/Pictures/Wallpapers/hsin.jpg
    color = $bg
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.85
    brightness = 0.55
    vibrancy = 0.17
    crossfade_time = 0.4
}

# Clock
label {
    monitor =
    text = $TIME
    color = $accent
    font_size = 110
    font_family = Orbitron
    position = 0, 170
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.6)
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $secondary
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = cmd[update:3600000] ~/.config/hypr/lockquote.sh
    text_align = center
    color = $text90
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 10
    halign = center
    valign = center
}

# Password box
input-field {
    monitor =
    size = 300, 54
    outline_thickness = 2
    rounding = 14
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $inner
    font_color = $text
    check_color = $secondary
    fail_color = $alert
    capslock_color = $accent
    fade_on_empty = false
    hide_input = false
    placeholder_text = <i>$placeholder</i>
    fail_text = <i>$failtext ($ATTEMPTS)</i>
    position = 0, -70
    halign = center
    valign = center
}

# Battery
label {
    monitor =
    text = cmd[update:30000] echo "BAT $(cat /sys/class/power_supply/BAT*/capacity)%"
    color = $secondary80
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = bottom
}
