# ~/.config/hypr/hyprlock.conf  (Hsin palette)

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    # Prefer your wallpaper instead? Use: path = ~/Pictures/Wallpapers/hsin.jpg
    color = rgba(18, 19, 26, 1.0)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.85
    brightness = 0.55
    vibrancy = 0.17
    crossfade_time = 0.4
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(244, 162, 97, 1.0)
    font_size = 110
    font_family = Orbitron
    position = 0, 170
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.6)
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(168, 222, 220, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = cmd[update:3600000] ~/.config/hypr/lockquote.sh
    text_align = center
    color = rgba(224, 225, 221, 0.9)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 10
    halign = center
    valign = center
}

# Password box
input-field {
    monitor =
    size = 300, 54
    outline_thickness = 2
    rounding = 14
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(244, 162, 97)
    inner_color = rgba(18, 19, 26, 0.75)
    font_color = rgb(224, 225, 221)
    check_color = rgb(168, 222, 220)
    fail_color = rgb(214, 40, 40)
    capslock_color = rgb(244, 162, 97)
    fade_on_empty = false
    hide_input = false
    placeholder_text = <i>Does this please you?</i>
    fail_text = <i>Insolence... ($ATTEMPTS)</i>
    position = 0, -70
    halign = center
    valign = center
}

# Battery
label {
    monitor =
    text = cmd[update:30000] echo "BAT $(cat /sys/class/power_supply/BAT*/capacity)%"
    color = rgba(168, 222, 220, 0.8)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = bottom
}
