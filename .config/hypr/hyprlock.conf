# ~/.config/hypr/hyprlock.conf

background {
    monitor =
    path = screenshot  # Takes a blurred snapshot of your current workspace on lock
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    
    # Visual Theme Colors (Hsin Ink & Gold Accents)
    outer_color = rgb(244, 162, 97)   # Amber Gold Frame
    inner_color = rgb(18, 19, 26)     # Deep Midnight Ink Background
    font_color = rgb(224, 225, 221)   # Silver Text
    
    fade_on_empty = false
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

# The Clock Display Element
label {
    monitor =
    text = $TIME
    color = rgb(224, 225, 221)
    font_size = 55
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
}
